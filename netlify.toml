# 務必由 Netlify 在建置時產生 dist，勿直接發布過期的 dist/ 靜態檔
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Unzip API 金鑰（擇一或兩者都設）：
#   UNZIP_API_KEY        → 給 /.netlify/functions/unzip 代理用（建議，不會進前端 bundle）
#   VITE_UNZIP_API_KEY   → 建置時寫入前端；代理失敗時可改直連 Unzip API
# 設定後請 Trigger deploy → Clear cache and deploy site

# 讓瀏覽器／CDN 優先取得最新 index.html（內含新版 JS/CSS 檔名）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# 正式資產仍可長快取（檔名含 hash，更新時檔名會變）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
